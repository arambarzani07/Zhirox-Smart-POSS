name: Zhirox CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Verify Node.js compatibility
        run: node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 15)) { console.error('Zhirox requires Node >=22.15.0; got ' + process.versions.node); process.exit(1); }"

      # This repository currently has no committed package-lock.json. npm ci and
      # setup-node's npm cache both require a lockfile, so use a clean npm install
      # until the dependency graph is intentionally locked and committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next standalone
        run: npm run build

      - name: Run regression tests
        run: npm test
